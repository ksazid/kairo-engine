name: Flow 1A Public Source Certification

on:
  push:
    branches:
      - feat/flow-1a-public-source-certification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install fallback Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Deterministic tests
        run: npm test
      - name: Live website certification
        run: npm run certify:websites
      - name: Print certification report
        if: always()
        run: |
          if [ -f certification-results.json ]; then
            cat certification-results.json
          fi
